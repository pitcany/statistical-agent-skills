id: causal-claim-without-overlap
skill: causal-inference
polarity: positive
summary: Treated and control propensity distributions barely overlap, so the population ATE is not identified, yet an ATE and a $3.1M rollout recommendation are being reported.

must_identify:
  - Names the estimand the slide requires - the effect of assigning a CSM on accounts that currently do not have one, in the $20k-$150k ARR band - and shows it is not the quantity estimated.
  - Identifies the positivity/overlap violation concretely from the supplied quantiles - treated p5 = 0.52 versus control p95 = 0.21, so the two distributions are effectively disjoint and there is almost no region of common support; the ATE over the full population is therefore not identified from these data and is produced only by model-based extrapolation of the outcome/propensity model into regions with no comparable units.
  - Explains that AUC 0.94 on the propensity model is a symptom, not a virtue - near-perfect treatment prediction is the definition of poor overlap.
  - Explains that post-weighting standardized mean differences below 0.10 do not establish identification; balance can be achieved on measured covariates by extreme weights while the estimate rests on a handful of units, and asks for the effective sample size / weight distribution (max weight 41 with 812 treated implies a small ESS), noting the robust SE of 1.2pp is implausibly precise and understates the true uncertainty.
  - States the confounding-by-design problem separately - assignment is made by account teams on expected expansion and account health, so unmeasured determinants (executive sponsorship, renewal risk already flagged, product fit) are plausibly correlated with both treatment and renewal; the direction is unknown but likely optimistic.
  - Prescribes concrete remedies - restrict to the region of common support and re-state the estimand as an ATT or an overlap-weighted (ATO) effect on that subpopulation, trim or truncate weights and report ESS and the trimmed sample, or abandon the population ATE; and adds sensitivity analysis (E-value / Rosenbaum bounds) for unmeasured confounding.
  - States that the rollout question is about accounts outside the support and can only be answered credibly by a randomized or staged rollout on exactly that band, and recommends that as the decision-grade evidence.
must_mention_any:
  - [overlap, positivity, common support, off-support, off support]
  - [trim, truncat, overlap weight, ATO, restrict, ATT, common-support subset]
  - [effective sample size, ESS, extreme weight, large weight, weight distribution]
  - [not identified, cannot be identified, unidentified, extrapolat]
  - [unmeasured confound, unobserved confound, sensitivity analysis, e-value, rosenbaum]
  - [randomi, staged rollout, pilot, experiment]
forbidden_behaviors:
  - Endorses the causal claim on the slide or the $3.1M rollout recommendation.
  - Treats post-weighting standardized mean differences under 0.10 as sufficient evidence that the estimate is credible.
  - Recommends adding more covariates to the propensity model as the fix for the overlap problem.
  - Reports the +11.3pp as an effect with a caveat attached, rather than as a quantity that is not identified over the stated population.
forbidden_patterns:
  - '(the )?(ATE|estimate|effect|11\.3)[^.\n]{0,70}(is|appears|remains|seems) (valid|unbiased|credible|reliable|well[- ]identified|robust)'
  - '(dedicated )?CSMs?[^.\n]{0,30}(cause|causes|caused|drives|drove|leads to|led to)[^.\n]{0,40}(11|renewal|lift)'
  - '(balance|standardi[sz]ed mean difference|SMD)[^.\n]{0,60}(so|therefore|hence|which means|confirms)[^.\n]{0,40}(identif|unbiased|credible|valid)'
  - '(add|include)[^.\n]{0,40}(more |additional )?(covariates|controls|variables)[^.\n]{0,50}(fix|solve|address|resolve)[^.\n]{0,30}(the )?(overlap|positivity)'
  - '(roll(ing)?[- ]?out|extend\w*)[^.\n]{0,50}(all accounts|2,?600)[^.\n]{0,40}(is|seems|looks) (justified|supported|reasonable|sensible)'
required_severity: blocker
notes: |
  A correct answer separates estimand from estimate - the slide needs the effect on
  currently-uncovered mid-ARR accounts, the analysis reports a population ATE - then shows
  from treated p5 = 0.52 versus control p95 = 0.21 that there is essentially no common
  support, so the number is extrapolation; it treats AUC 0.94 as evidence of the violation,
  refuses balance statistics as proof of identification, demands ESS and weight
  diagnostics, adds unmeasured confounding as a separate threat, and routes the rollout
  decision to a staged randomized rollout.
  A plausible-but-wrong answer accepts the estimate because balance was achieved and
  weights were stabilized, or downgrades the problem to "some extrapolation, interpret with
  caution", or proposes enriching the propensity model - which cannot create support that
  does not exist.
